name: Update Apps and Deploy Pages

on:
  schedule:
    - cron: '0 */6 * * *'
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  update-apps:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch Latest Releases & Generate Files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # -------------------------------------------------------------
          # DEFINE YOUR APPS HERE
          # Format: "Display Name | repo/owner | regex_filename_pattern"
          # -------------------------------------------------------------
          APPS=(
            "Tizen Tube Cobalt (Youtube TV)|reisxd/TizenTubeCobalt|cobalt-arm\.apk$"
            "SmartTube Stable (Backup)|yuliskov/SmartTube|armeabi-v7a\.apk$"
          )

          # Start README.md
          echo "# Direct App Downloads (@hv33y)" > README.md
          echo "" >> README.md

          # Start index.html header
          cat << 'EOF' > index.html
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>App Downloader - @hv33y</title>
            <style>
              body {
                font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
                background-color: #0f172a;
                color: #f8fafc;
                margin: 0;
                padding: 2.5rem 1.5rem;
                display: flex;
                flex-direction: column;
                align-items: center;
              }
              h1 {
                font-size: 2.2rem;
                margin-bottom: 2rem;
                text-align: center;
              }
              .grid {
                display: flex;
                flex-direction: column;
                gap: 1.25rem;
                width: 100%;
                max-width: 650px;
              }
              .card {
                display: flex;
                align-items: center;
                justify-content: space-between;
                background-color: #1e293b;
                border: 2px solid #334155;
                border-radius: 16px;
                padding: 1.5rem 2rem;
                text-decoration: none;
                color: #ffffff;
                font-size: 1.5rem;
                font-weight: 700;
                transition: transform 0.15s ease, border-color 0.15s ease, background-color 0.15s ease;
              }
              .card:hover, .card:focus {
                background-color: #2563eb;
                border-color: #60a5fa;
                transform: scale(1.03);
                outline: 4px solid #93c5fd;
              }
              .badge {
                font-size: 1rem;
                background: #0ea5e9;
                padding: 0.4rem 0.8rem;
                border-radius: 8px;
                font-weight: 600;
              }
            </style>
          </head>
          <body>
            <h1>Direct App Downloads (@hv33y)</h1>
            <div class="grid">
          EOF

          # Process apps
          for entry in "${APPS[@]}"; do
            IFS="|" read -r APP_NAME APP_REPO APP_PATTERN <<< "$entry"
            echo "----------------------------------------"
            echo "Checking: $APP_NAME ($APP_REPO)..."
            echo "Pattern:  $APP_PATTERN"

            # Fetch TSV list of: name <tab> download_url
            ASSETS_TSV=$(gh release view --repo "$APP_REPO" --json assets --jq '.assets[] | "\(.name)\t\(.url)"')

            # Match filename against the regex pattern using grep -E
            MATCH=$(echo "$ASSETS_TSV" | grep -E "^[^\t]*${APP_PATTERN}" | head -n 1)

            if [ -n "$MATCH" ]; then
              MATCH_FILE=$(echo "$MATCH" | cut -f1)
              DOWNLOAD_URL=$(echo "$MATCH" | cut -f2)

              echo "Matched File: $MATCH_FILE"
              echo "Matched URL:  $DOWNLOAD_URL"

              # Append to README.md
              echo "- [$APP_NAME]($DOWNLOAD_URL)" >> README.md

              # Append to index.html
              cat << EOF >> index.html
              <a href="$DOWNLOAD_URL" class="card">
                <span>$APP_NAME</span>
                <span class="badge">Download APK</span>
              </a>
          EOF
            else
              echo "ERROR: No asset matched regex '$APP_PATTERN' for $APP_REPO"
              echo "Available assets were:"
              echo "$ASSETS_TSV" | cut -f1
              exit 1
            fi
          done

          # Close index.html
          cat << 'EOF' >> index.html
            </div>
          </body>
          </html>
          EOF

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add README.md index.html

          if git diff --staged --quiet; then
            echo "No changes detected. Everything is up to date."
          else
            git commit -m "Update app download links"
            git push origin master
          fi

  build-and-deploy:
    needs: update-apps
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
