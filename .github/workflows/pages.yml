name: Update README and Deploy Pages

on:
  schedule:
    - cron: '0 */6 * * *'
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  update-readme:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch latest cobalt-arm.apk release URL
        id: get_release
        run: |
          RELEASE_JSON=$(curl -sL \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/reisxd/TizenTubeCobalt/releases/latest)

          DOWNLOAD_URL=$(echo "$RELEASE_JSON" | jq -r '
            .assets[] 
            | select(.name == "cobalt-arm.apk") 
            | .browser_download_url
          ' | head -n 1)

          if [ -z "$DOWNLOAD_URL" ] || [ "$DOWNLOAD_URL" = "null" ]; then
            echo "Error: Could not find cobalt-arm.apk in the latest release."
            exit 1
          fi

          echo "download_url=$DOWNLOAD_URL" >> "$GITHUB_OUTPUT"

      - name: Overwrite README.md
        run: |
          cat << 'EOF' > README.md
          - [YouTube](${{ steps.get_release.outputs.download_url }})
          EOF
          sed -i -e '$a\' README.md

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add README.md

          if git diff --staged --quiet; then
            echo "README.md is already up to date."
          else
            git commit -m "Update README.md with latest cobalt-arm.apk release"
            git push
          fi

  build-and-deploy:
    needs: update-readme
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout updated repo
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
