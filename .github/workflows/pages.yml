name: Update README and Deploy Pages

on:
  schedule:
    # Runs automatically every 6 hours
    - cron: '0 */6 * * *'
  push:
    branches: ["master"]
  workflow_dispatch:

# Grant token permissions to write commits and publish to Pages
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  update-readme:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch latest cobalt-arm.apk release URL
        id: get_release
        env:
          # Automatically uses GitHub's built-in token (no manual setup required)
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DOWNLOAD_URL=$(gh release view \
            --repo reisxd/TizenTubeCobalt \
            --json assets \
            --jq '.assets[] | select(.name == "cobalt-arm.apk") | .url' | head -n 1)

          if [ -z "$DOWNLOAD_URL" ] || [ "$DOWNLOAD_URL" = "null" ]; then
            echo "Error: Could not find cobalt-arm.apk in the latest release."
            exit 1
          fi

          echo "Found APK URL: $DOWNLOAD_URL"
          echo "download_url=$DOWNLOAD_URL" >> "$GITHUB_OUTPUT"

      - name: Overwrite README.md
        run: |
          cat << 'EOF' > README.md
          - [YouTube](${{ steps.get_release.outputs.download_url }})
          EOF
          sed -i -e '$a\' README.md

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add README.md

          if git diff --staged --quiet; then
            echo "README.md is already up to date."
          else
            git commit -m "Update README.md with latest cobalt-arm.apk release"
            git push
          fi

  build-and-deploy:
    needs: update-readme
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
