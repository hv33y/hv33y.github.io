name: Update Apps and Deploy Pages

on:
  schedule:
    - cron: '0 */6 * * *'
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  update-apps:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch Latest Releases & Generate Files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # -------------------------------------------------------------
          # DEFINE YOUR APPS HERE
          # Format: "Display Name | repo/owner | regex_pattern"
          # -------------------------------------------------------------
          APPS=(
            "Tizen Tube Cobalt (Youtube TV)|reisxd/TizenTubeCobalt|^cobalt-arm\.apk$"
            "SmartTube Stable (Backup)|yuliskov/SmartTube|armeabi-v7a\.apk$"
          )

          # Ensure custom domain persistence for GitHub Pages
          echo "d.harry.run" > CNAME

          # Start README.md
          echo "# Direct App Downloads (@hv33y)" > README.md
          echo "" >> README.md

          # Start index.html header with updated SEO for d.harry.run
          cat << 'EOF' > index.html
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>App Downloader | @hv33y</title>

            <!-- SEO Meta Tags -->
            <meta name="description" content="Direct, remote-friendly APK downloads for Android TV and Fire TV maintained by @hv33y.">
            <meta name="author" content="hv33y">
            <meta name="robots" content="index, follow">
            <link rel="canonical" href="https://d.harry.run/">

            <!-- Open Graph / Facebook / Discord -->
            <meta property="og:type" content="website">
            <meta property="og:title" content="App Downloader | @hv33y">
            <meta property="og:description" content="Direct, remote-friendly APK downloads for Android TV and Fire TV maintained by @hv33y.">
            <meta property="og:url" content="https://d.harry.run/">
            <meta property="og:site_name" content="hv33y App Downloader">
            <meta property="og:image" content="https://github.com/hv33y.png">

            <!-- Twitter Card -->
            <meta name="twitter:card" content="summary">
            <meta name="twitter:title" content="App Downloader | @hv33y">
            <meta name="twitter:description" content="Direct, remote-friendly APK downloads for Android TV and Fire TV maintained by @hv33y.">
            <meta name="twitter:image" content="https://github.com/hv33y.png">

            <!-- Favicons -->
            <link rel="icon" type="image/png" href="https://github.com/hv33y.png">
            <link rel="apple-touch-icon" href="https://github.com/hv33y.png">

            <style>
              * {
                box-sizing: border-box;
              }
              body {
                font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
                background-color: #ffffff;
                color: #111827;
                margin: 0;
                padding: 3rem 1.5rem;
                display: flex;
                flex-direction: column;
                align-items: center;
                min-height: 100vh;
              }
              .container {
                width: 100%;
                max-width: 600px;
                display: flex;
                flex-direction: column;
                flex-grow: 1;
              }
              header {
                display: flex;
                flex-direction: column;
                align-items: center;
                margin-bottom: 2rem;
              }
              .avatar {
                width: 64px;
                height: 64px;
                border-radius: 50%;
                margin-bottom: 1rem;
                border: 2px solid #e5e7eb;
              }
              h1 {
                font-size: 1.85rem;
                font-weight: 800;
                margin: 0;
                text-align: center;
                letter-spacing: -0.025em;
              }
              .grid {
                display: flex;
                flex-direction: column;
                gap: 1rem;
                width: 100%;
              }
              .card {
                display: flex;
                align-items: center;
                justify-content: space-between;
                background-color: #ffffff;
                border: 2px solid #e5e7eb;
                border-radius: 12px;
                padding: 1.25rem 1.75rem;
                text-decoration: none;
                color: #111827;
                font-size: 1.25rem;
                font-weight: 600;
                transition: border-color 0.15s ease, background-color 0.15s ease;
              }
              .card:hover, .card:focus {
                background-color: #f9fafb;
                border-color: #111827;
                outline: 3px solid #111827;
              }
              .btn-text {
                font-size: 0.95rem;
                font-weight: 700;
                background-color: #111827;
                color: #ffffff;
                padding: 0.5rem 1rem;
                border-radius: 6px;
              }
              footer {
                margin-top: auto;
                padding-top: 3rem;
                text-align: center;
                font-size: 0.9rem;
              }
              footer a {
                color: #6b7280;
                text-decoration: none;
                font-weight: 500;
              }
              footer a:hover, footer a:focus {
                color: #111827;
                text-decoration: underline;
              }
            </style>
          </head>
          <body>
            <div class="container">
              <header>
                <img class="avatar" src="https://github.com/hv33y.png" alt="hv33y avatar">
                <h1>Direct App Downloads</h1>
              </header>
              <div class="grid">
          EOF

          # Process apps
          for entry in "${APPS[@]}"; do
            IFS="|" read -r APP_NAME APP_REPO APP_PATTERN <<< "$entry"
            echo "----------------------------------------"
            echo "Checking: $APP_NAME ($APP_REPO)..."
            echo "Pattern:  $APP_PATTERN"

            DOWNLOAD_URL=$(gh release view --repo "$APP_REPO" --json assets | \
              jq -r --arg pat "$APP_PATTERN" '.assets[] | select(.name | test($pat)) | .url' | head -n 1)

            if [ -n "$DOWNLOAD_URL" ] && [ "$DOWNLOAD_URL" != "null" ]; then
              echo "Matched URL: $DOWNLOAD_URL"

              # Append to README.md
              echo "- [$APP_NAME]($DOWNLOAD_URL)" >> README.md

              # Append to index.html
              cat << EOF >> index.html
              <a href="$DOWNLOAD_URL" class="card">
                <span>$APP_NAME</span>
                <span class="btn-text">Download</span>
              </a>
          EOF
            else
              echo "ERROR: No asset matched regex '$APP_PATTERN' for $APP_REPO"
              echo "Available assets were:"
              gh release view --repo "$APP_REPO" --json assets --jq '.assets[].name'
              exit 1
            fi
          done

          # Close index.html with footer
          cat << 'EOF' >> index.html
              </div>
              <footer>
                <a href="https://github.com/hv33y" target="_blank" rel="noopener noreferrer">github.com/hv33y</a>
              </footer>
            </div>
          </body>
          </html>
          EOF

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add README.md index.html CNAME

          if git diff --staged --quiet; then
            echo "No changes detected. Everything is up to date."
          else
            git commit -m "Configure d.harry.run domain and update links"
            git push origin master
          fi

  build-and-deploy:
    needs: update-apps
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
