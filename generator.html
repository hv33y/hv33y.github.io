<!DOCTYPE html>
<html>
<head><title>OG Image Generator</title></head>
<body style="background: #050505; color: white; font-family: sans-serif; text-align: center; padding-top: 50px;">
  <h2>Generating og-preview.jpg...</h2>
  <p>Check your downloads folder.</p>
  
  <script>
    const canvas = document.createElement('canvas');
    canvas.width = 1200;
    canvas.height = 630;
    const ctx = canvas.getContext('2d');
    
    const img = new Image();
    // Point this to whatever your logo file is named
    img.src = 'hv33y.png'; 
    
    img.onload = () => {
      // Draw the deep black 4DX background
      ctx.fillStyle = '#050505';
      ctx.fillRect(0, 0, 1200, 630);
      
      // Scale the logo to fit perfectly in the center
      const scale = Math.min(1200 / img.width, 630 / img.height);
      const w = img.width * scale;
      const h = img.height * scale;
      const x = (1200 - w) / 2;
      const y = (630 - h) / 2;
      
      ctx.drawImage(img, x, y, w, h);
      
      // Auto-download the final JPG
      const a = document.createElement('a');
      a.download = 'og-preview.jpg';
      a.href = canvas.toDataURL('image/jpeg', 1.0);
      a.click();
    };

    img.onerror = () => {
      document.body.innerHTML = "<h2>Error: Could not load hv33y.png</h2><p>Make sure the image is in the same folder as this HTML file.</p>";
    };
  </script>
</body>
</html>
